name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create mock google-services.json for CI
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "com-gokcank-astroyorum",
              "storage_bucket": "com-gokcank-astroyorum.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.gokcank.astroyorum"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "mock_key"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --stacktrace
